<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Productos</title>
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>

  <header>
    <div class="header-content">
      <h1>🛒 Catálogo de Productos</h1>
      <div class="header-right">
        <button id="btnAdmin" class="btn btn-admin" title="Panel Trabajador">⚙️</button>
        <div class="cart-summary" id="cartSummary">
          <span id="cartCount">0</span> productos seleccionados
          <button id="btnViewCart" class="btn btn-cart">Ver Pedido</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="filters">
      <input type="text" id="searchInput" placeholder="Buscar productos..." />
      <select id="categoryFilter">
        <option value="all">Todas las categorías</option>
      </select>
      <select id="sortSelect">
        <option value="default">Ordenar por</option>
        <option value="name-asc">Nombre A-Z</option>
        <option value="name-desc">Nombre Z-A</option>
        <option value="price-asc">Precio menor a mayor</option>
        <option value="price-desc">Precio mayor a menor</option>
      </select>
    </section>

    <section class="catalog" id="catalog"></section>
  </main>

  <!-- Modal Login -->
  <div class="modal-overlay" id="loginOverlay">
    <div class="modal modal-login">
      <div class="modal-header">
        <h2>🔒 Acceso Trabajadores</h2>
        <button class="btn-close" id="btnCloseLogin">&times;</button>
      </div>
      <div class="modal-body">
        <form id="loginForm">
          <div class="form-group">
            <label for="loginUser">Usuario</label>
            <input type="text" id="loginUser" placeholder="Ingresa tu usuario" required />
          </div>
          <div class="form-group">
            <label for="loginPass">Contraseña</label>
            <input type="password" id="loginPass" placeholder="Ingresa tu contraseña" required />
          </div>
          <p class="login-error" id="loginError">Usuario o contraseña incorrectos</p>
          <button type="submit" class="btn btn-primary btn-full">Entrar</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Panel Admin -->
  <div class="modal-overlay" id="adminOverlay">
    <div class="modal modal-admin">
      <div class="modal-header">
        <h2>⚙️ Panel de Administración</h2>
        <button class="btn-close" id="btnCloseAdmin">&times;</button>
      </div>
      <div class="modal-body">
        <div class="admin-bar">
          <span class="admin-user" id="adminUserLabel">👤</span>
          <button class="btn btn-secondary" id="btnLogout">Cerrar sesión</button>
        </div>

        <h3 class="section-title">Agregar nuevo producto</h3>
        <form id="productForm">
          <div class="form-row">
            <div class="form-group">
              <label for="prodName">Nombre *</label>
              <input type="text" id="prodName" placeholder="Ej: Laptop HP" required />
            </div>
            <div class="form-group">
              <label for="prodEmoji">Emoji *</label>
              <input type="text" id="prodEmoji" placeholder="Ej: 💻" maxlength="4" required />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="prodCategory">Categoría *</label>
              <input type="text" id="prodCategory" placeholder="Ej: Electrónica" required />
            </div>
            <div class="form-group">
              <label for="prodPrice">Precio ($) *</label>
              <input type="number" id="prodPrice" placeholder="Ej: 29.99" step="0.01" min="0.01" required />
            </div>
          </div>
          <div class="form-group">
            <label for="prodDesc">Descripción</label>
            <input type="text" id="prodDesc" placeholder="Descripción breve del producto" />
          </div>
          <button type="submit" class="btn btn-primary btn-full">➕ Agregar Producto</button>
        </form>

        <h3 class="section-title">Productos agregados (<span id="customCount">0</span>)</h3>
        <div id="adminProductList" class="admin-product-list">
          <p class="empty-msg">No has agregado productos aún.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal del carrito -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2>Mi Pedido</h2>
        <button class="btn-close" id="btnCloseModal">&times;</button>
      </div>
      <div class="modal-body" id="modalBody">
        <p class="empty-msg">No has seleccionado ningún producto aún.</p>
      </div>
      <div class="modal-footer" id="modalFooter">
        <div class="total-section">
          <strong>Total:</strong> $<span id="totalPrice">0.00</span>
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" id="btnClearCart">Vaciar Carrito</button>
          <button class="btn btn-primary" id="btnConfirmOrder">Confirmar Pedido</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Notificación -->
  <div class="notification" id="notification"></div>

  <script src="app.js?v=2"></script>
</body>
</html>
